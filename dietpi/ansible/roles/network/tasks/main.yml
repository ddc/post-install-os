---
##### STATIC IPv4 + HOST DNS #####

# Same layout dietpi-config writes, so the file stays editable from dietpi-config.
# Switching to static stops udhcpc (and its resolv.conf rewrites) from next boot.
- name: Configure static IPv4 in /etc/network/interfaces
  ansible.builtin.copy:
    content: |
      # Location: /etc/network/interfaces
      # Please modify network settings via: dietpi-config
      # Or create your own drop-ins in: /etc/network/interfaces.d/

      # Drop-in configs
      source interfaces.d/*

      # Ethernet
      allow-hotplug {{ network_interface }}
      iface {{ network_interface }} inet static
      address {{ static_ipv4_address }}
      netmask {{ static_ipv4_netmask }}
      gateway {{ static_ipv4_gateway }}
      #dns-nameservers {{ host_dns_servers | join(' ') }}

      # WiFi
      #allow-hotplug wlan0
      iface wlan0 inet dhcp
      address {{ static_ipv4_address }}
      netmask {{ static_ipv4_netmask }}
      gateway {{ static_ipv4_gateway }}
      #dns-nameservers {{ host_dns_servers | join(' ') }}
      wireless-power off
      wpa-conf /etc/wpa_supplicant/wpa_supplicant.conf
    dest: /etc/network/interfaces
    owner: root
    group: root
    mode: '0644'
    backup: yes
  become: yes
  register: interfaces_result

- name: Configure host DNS in /etc/resolv.conf
  ansible.builtin.copy:
    content: |
      # ANSIBLE MANAGED - upstream DNS only (never the local Pi-hole, avoids a DNS loop)
      {% for server in host_dns_servers %}
      nameserver {{ server }}
      {% endfor %}
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: '0644'
  become: yes

# Apply now without bouncing the interface (keeps the SSH session alive): the IP
# is unchanged, and udhcpc exits on SIGTERM without releasing the lease (no -R),
# so the address stays. It just stops rewriting resolv.conf on lease renewal.
- name: Stop udhcpc on {{ network_interface }} (static config takes over)
  ansible.builtin.command: pkill -f "udhcpc .*-i {{ network_interface }}"
  become: yes
  register: udhcpc_kill
  changed_when: udhcpc_kill.rc == 0
  failed_when: udhcpc_kill.rc > 1
  when: interfaces_result.changed

##### STATIC IPv6 #####

- name: Detect current IPv6 SLAAC address
  ansible.builtin.shell: "ip -6 addr show {{ network_interface }} | grep 'scope global dynamic' | awk '{print $2}' | head -1"
  register: slaac_address
  changed_when: false
  failed_when: false
  when: static_ipv6_enable

- name: Extract IPv6 prefix from SLAAC address
  ansible.builtin.set_fact:
    ipv6_prefix: "{{ slaac_address.stdout.split(':')[0:4] | join(':') }}"
  when:
    - static_ipv6_enable
    - slaac_address.stdout | length > 0

- name: Detect current IPv6 gateway
  ansible.builtin.shell: "ip -6 route show default | grep -oP 'via \\K[^ ]+'"
  register: detected_gateway
  changed_when: false
  failed_when: false
  when: static_ipv6_enable

- name: Set dynamic IPv6 variables
  ansible.builtin.set_fact:
    static_ipv6_address: "{{ ipv6_prefix }}::{{ static_ipv6_host | default('100') }}/64"
    static_ipv6_gateway: "{{ detected_gateway.stdout }}"
  when:
    - static_ipv6_enable
    - ipv6_prefix is defined
    - detected_gateway.stdout | length > 0

- name: Display detected IPv6 configuration
  ansible.builtin.debug:
    msg:
      - "Detected IPv6 prefix: {{ ipv6_prefix }}"
      - "Detected gateway: {{ detected_gateway.stdout }}"
      - "Static IPv6 address will be: {{ static_ipv6_address }}"
  when:
    - static_ipv6_enable
    - ipv6_prefix is defined

- name: Check if static IPv6 is already configured
  ansible.builtin.shell: "ip -6 addr show {{ network_interface }} | grep '{{ static_ipv6_address.split('/')[0] }}'"
  register: ipv6_check
  changed_when: false
  failed_when: false
  when:
    - static_ipv6_enable
    - static_ipv6_address is defined

- name: Add static IPv6 address to network interface
  ansible.builtin.command: "ip -6 addr add {{ static_ipv6_address }} dev {{ network_interface }}"
  become: yes
  when:
    - static_ipv6_enable
    - static_ipv6_address is defined
    - ipv6_check.rc != 0

- name: Add default IPv6 gateway
  ansible.builtin.command: "ip -6 route add default via {{ static_ipv6_gateway }} dev {{ network_interface }}"
  become: yes
  when:
    - static_ipv6_enable
    - static_ipv6_gateway is defined
  failed_when: false
  changed_when: true

- name: Create systemd-networkd config for persistent IPv6
  ansible.builtin.copy:
    content: |
      [Match]
      Name={{ network_interface }}

      [Network]
      Address={{ static_ipv6_address }}
      Gateway={{ static_ipv6_gateway }}
    dest: /etc/systemd/network/10-{{ network_interface }}-static-ipv6.network
    mode: '0644'
  become: yes
  when:
    - static_ipv6_enable
    - static_ipv6_address is defined

- name: Display IPv6 configuration
  ansible.builtin.command: ip -6 addr show {{ network_interface }}
  register: ipv6_result
  changed_when: false
  when: static_ipv6_enable

- name: Show IPv6 addresses
  ansible.builtin.debug:
    msg: "IPv6 configured: {{ ipv6_result.stdout_lines }}"
  when: static_ipv6_enable
