---
hostname: "DietPi"

# NTP servers pinned by IP so time sync never depends on DNS.
# Prevents a boot-time deadlock after power loss: the Pi has no battery-backed
# clock, so a wrong clock makes DNSSEC signatures look invalid (SERVFAIL) -> the
# NTP pool hostnames can't be resolved -> the clock is never corrected.
# Cloudflare time.cloudflare.com (primary), Google time.google.com (fallback).
ntp_servers: "162.159.200.1 162.159.200.123"
ntp_fallback_servers: "216.239.35.0 216.239.35.4"

# Initial installation packages
install_packages:
  - vim
  - git
  - nmap
  - btop
  - zstd
