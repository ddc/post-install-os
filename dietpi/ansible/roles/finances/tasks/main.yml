---

- name: Check if finances directory exists
  ansible.builtin.stat:
    path: "{{ finances_install_dir }}"
  register: finances_dir

- name: Stop existing finances containers
  ansible.builtin.shell: "{{ finances_install_dir }}/utilities/stop.sh"
  become_user: "{{ new_users[0].name }}"
  when: finances_dir.stat.exists

- name: Remove existing finances directory
  ansible.builtin.file:
    path: "{{ finances_install_dir }}"
    state: absent
  become: yes

- name: Clone finances repository
  ansible.builtin.git:
    repo: "{{ finances_repo_url }}"
    dest: "{{ finances_install_dir }}"
    version: main
    force: yes
  become_user: "{{ new_users[0].name }}"

- name: Upload .env file ({{ env_type }})
  ansible.builtin.copy:
    src: ".env.{{ env_type }}"
    dest: "{{ finances_install_dir }}/.env"
    owner: "{{ new_users[0].name }}"
    group: "{{ new_users[0].name }}"
    mode: '0600'
  become: yes

- name: Upload SSL certificates
  ansible.builtin.copy:
    src: certs/
    dest: "{{ finances_install_dir }}/certs/"
    owner: "{{ new_users[0].name }}"
    group: "{{ new_users[0].name }}"
    mode: '0644'
  become: yes

- name: Wait for postgres container to be healthy
  ansible.builtin.shell: docker inspect --format='{% raw %}{{.State.Health.Status}}{% endraw %}' postgres
  register: postgres_health
  until: postgres_health.stdout == "healthy"
  retries: 30
  delay: 5
  become_user: "{{ new_users[0].name }}"

- name: Create finances database user
  ansible.builtin.shell: |
    docker exec -e PGPASSWORD=postgres postgres psql -U postgres -tc "SELECT 1 FROM pg_roles WHERE rolname='finances'" | grep -q 1 || \
    docker exec -e PGPASSWORD=postgres postgres psql -U postgres -c "CREATE USER finances WITH PASSWORD 'finances';"
  become_user: "{{ new_users[0].name }}"
  changed_when: false

- name: Create finances database
  ansible.builtin.shell: |
    docker exec -e PGPASSWORD=postgres postgres psql -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='finances'" | grep -q 1 || \
    docker exec -e PGPASSWORD=postgres postgres psql -U postgres -c "CREATE DATABASE finances OWNER finances;"
  become_user: "{{ new_users[0].name }}"
  changed_when: false

- name: Set file permissions
  ansible.builtin.shell: |
    chown -R {{ new_users[0].name }}:{{ new_users[0].name }} {{ finances_install_dir }}
    find {{ finances_install_dir }} -type d -exec chmod 755 {} +
    find {{ finances_install_dir }} -type f -exec chmod 644 {} +
    chmod 600 {{ finances_install_dir }}/.env
    find {{ finances_install_dir }}/utilities/ -name "*.sh" -exec chmod 755 {} +
  become: yes
  changed_when: true

- name: Create logs directory
  ansible.builtin.file:
    path: "{{ finances_install_dir }}/backend/logs"
    state: directory
    owner: "1000"
    group: "1000"
    mode: '0755'
  become: yes

- name: Fix frontend logs directory ownership for nginx (UID 101)
  ansible.builtin.file:
    path: "{{ finances_install_dir }}/frontend/logs"
    state: directory
    owner: "101"
    group: "101"
    mode: '0755'
  become: yes

- name: Build and start finances containers
  ansible.builtin.shell: "{{ finances_install_dir }}/utilities/start.sh"
  become_user: "{{ new_users[0].name }}"

- name: Wait for backend to be healthy
  ansible.builtin.shell: |
    for i in $(seq 1 30); do
      if docker compose ps backend | grep -q healthy; then
        exit 0
      fi
      sleep 5
    done
    exit 1
  args:
    chdir: "{{ finances_install_dir }}"
  become_user: "{{ new_users[0].name }}"

- name: Display finances access info
  ansible.builtin.debug:
    msg: |
      Finances App deployed!
      URL: https://{{ ansible_default_ipv4.address }}
      CA cert for browser: {{ finances_install_dir }}/certs/finances_ca.crt

##### FIREWALL RULES #####

- name: Check if UFW is available (finances)
  ansible.builtin.command: which ufw
  register: finances_ufw_check
  changed_when: false
  failed_when: false
  when: firewall_enable

- name: Read Finances .env for frontend port
  ansible.builtin.shell: |
    grep 'FRONTEND_PORT=' {{ finances_install_dir }}/.env | cut -d '=' -f 2
  register: finances_port
  changed_when: false
  failed_when: false
  when: firewall_enable

- name: Allow Finances frontend port through firewall
  become: yes
  community.general.ufw:
    rule: allow
    port: "{{ finances_port.stdout }}"
    proto: tcp
    comment: 'Finances Frontend'
  when:
    - firewall_enable
    - finances_ufw_check.rc == 0
    - finances_port.stdout | length > 0
