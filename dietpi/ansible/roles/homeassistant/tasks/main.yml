---

- name: Ensure homeassistant container directory exists on host
  ansible.builtin.file:
    path: "{{ containers_remote_directory }}/homeassistant"
    state: directory
    owner: "{{ new_users[0].name }}"
    group: "{{ new_users[0].name }}"
    mode: '0755'
  become: yes

- name: Copy homeassistant container files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../containers/homeassistant/"
    dest: "{{ containers_remote_directory }}/homeassistant/"
    owner: "{{ new_users[0].name }}"
    group: "{{ new_users[0].name }}"
    mode: '0644'
    directory_mode: '0755'
  become: yes

- name: Make update_homeassistant.sh executable
  ansible.builtin.file:
    path: "{{ containers_remote_directory }}/homeassistant/update_homeassistant.sh"
    mode: '0755'
  become: yes

- name: Read Home Assistant .env for port
  ansible.builtin.shell: |
    grep 'HA_PORT=' {{ containers_remote_directory }}/homeassistant/.env | cut -d '=' -f 2
  register: homeassistant_port
  changed_when: false
  failed_when: false

- name: Check if homeassistant container is running
  ansible.builtin.shell: docker ps --format '{{ "{{" }}.Names{{ "}}" }}' | grep -q '^homeassistant$'
  become_user: "{{ new_users[0].name }}"
  register: homeassistant_running
  changed_when: false
  failed_when: false

- name: Pre-pull Home Assistant image (retries transient pull errors)
  ansible.builtin.shell: docker compose pull
  args:
    chdir: "{{ containers_remote_directory }}/homeassistant"
  become_user: "{{ new_users[0].name }}"
  register: homeassistant_pull
  until: homeassistant_pull.rc == 0
  retries: 3
  delay: 15
  changed_when: false
  when: homeassistant_running.rc != 0

- name: Start homeassistant fresh (first-time install)
  ansible.builtin.shell: docker compose up -d
  args:
    chdir: "{{ containers_remote_directory }}/homeassistant"
  become_user: "{{ new_users[0].name }}"
  when: homeassistant_running.rc != 0

- name: Run update_homeassistant.sh (backup + pull + restart + prune)
  ansible.builtin.shell: ./update_homeassistant.sh
  args:
    chdir: "{{ containers_remote_directory }}/homeassistant"
  become_user: "{{ new_users[0].name }}"
  when: homeassistant_running.rc == 0
  register: homeassistant_update_result

- name: Display homeassistant update output
  ansible.builtin.debug:
    var: homeassistant_update_result.stdout_lines
  when:
    - homeassistant_update_result is defined
    - homeassistant_update_result.stdout_lines is defined

- name: Wait for Home Assistant to answer on its port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ homeassistant_port.stdout | default('8123', true) }}"
    timeout: 300
  when: homeassistant_running.rc != 0

##### FIREWALL RULES #####
- name: Check if UFW is available (homeassistant)
  ansible.builtin.command: which ufw
  register: homeassistant_ufw_check
  changed_when: false
  failed_when: false
  when: firewall_enable

- name: Allow Home Assistant port through firewall
  become: yes
  community.general.ufw:
    rule: allow
    port: "{{ homeassistant_port.stdout }}"
    proto: tcp
    comment: 'Home Assistant Web'
  when:
    - firewall_enable
    - homeassistant_ufw_check.rc == 0
    - homeassistant_port.stdout | length > 0
